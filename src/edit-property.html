<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Property | Rental Scheduling System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="main-header">

        <h1>Rental Scheduling System</h1>

        <nav>
            <span class="header-user">
            Welcome,
            <strong id="headerUserName"></strong>
             </span>
             
            <a href="owner-dashboard.html">
                Dashboard
            </a>

            <button
                type="button"
                id="logoutButton"
            >
                Logout
            </button>

        </nav>

    </header>


    <main class="dashboard-container">

        <section class="form-section">

            <div class="page-heading">

                <h2>Edit Property</h2>

                <p>
                    Update your rental property information.
                </p>

            </div>


            <form id="editPropertyForm">


                <label for="editPropertyName">
                    Property Name
                </label>

                <input
                    type="text"
                    id="editPropertyName"
                    required
                >


                <label for="editPropertyType">
                    Property Type
                </label>

                <select
                    id="editPropertyType"
                    required
                >

                    <option value="">
                        Select property type
                    </option>

                    <option value="ROOM">
                        Room
                    </option>

                    <option value="APARTMENT">
                        Apartment
                    </option>

                    <option value="CONDO">
                        Condo
                    </option>

                    <option value="HOUSE">
                        House
                    </option>

                </select>


                <label for="editPropertyState">
                    State
                </label>

                <select
                    id="editPropertyState"
                    required
                >

                    <option value="">Select state </option>

                    <option value="Johor">Johor</option>
                    <option value="Kedah">Kedah</option>
                    <option value="Kelantan">Kelantan</option>
                    <option value="Melaka">Melaka</option>
                    <option value="Negeri Sembilan">Negeri Sembilan</option>
                    <option value="Pahang">Pahang</option>
                    <option value="Penang">Penang</option>
                    <option value="Perak">Perak</option>
                    <option value="Perlis">Perlis</option>
                    <option value="Sabah">Sabah</option>
                    <option value="Sarawak">Sarawak</option>
                    <option value="Selangor">Selangor</option>
                    <option value="Terengganu">Terengganu</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
                    <option value="Putrajaya">Putrajaya</option>
                    <option value="Labuan">Labuan</option>

                </select>


                <label for="editPropertyCity">
                    City
                </label>

                <select
                    id="editPropertyCity"
                    required
                    disabled
                >

                    <option value="">
                        Select city
                    </option>

                </select>


                <label for="editPropertyUnit">
                    Unit / Block / Room
                </label>

                <input
                    type="text"
                    id="editPropertyUnit"
                    required
                >


                <label for="editPropertyMap">
                    Google Maps URL
                </label>

                <input
                    type="url"
                    id="editPropertyMap"
                    required
                >

                <label>
                     Current Property Image
                </label>

                <div id="currentPropertyImage"></div>

                <label for="editPropertyImage">
                    Replace Property Image
                </label>

                <input
                    type="file"
                    id="editPropertyImage"
                    accept="image/*"
                >

                <p>
                  Leave this empty to keep the current property image.
                </p>


                <label for="editPropertyDescription">
                    Description
                </label>

                <textarea
                    id="editPropertyDescription"
                    rows="5"
                ></textarea>


                <label for="editPropertyRent">
                    Monthly Rent (RM)
                </label>

                <input
                    type="number"
                    id="editPropertyRent"
                    min="0"
                    step="0.01"
                    required
                >


                <p id="editPropertyMessage"></p>


                <div class="form-actions">

                    <a href="owner-dashboard.html">
                        Cancel
                    </a>

                    <button type="submit">
                        Save Changes
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="js/welcome.js"></script>
    <script src="js/property.js"></script>
    <script src="js/logout.js"></script>

</body>
</html>
