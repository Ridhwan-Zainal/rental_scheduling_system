<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Properties | Rental Scheduling System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="main-header">

        <h1>Rental Scheduling System</h1>

        <nav>

            <span class="header-user">
            Welcome,
            <strong id="headerUserName"></strong>
             </span>

            <span>Browse Properties</span>
           <a href="renter-bookings.html">
                My Bookings
           </a>
            <button
             type="button"
             id="logoutButton"
              >Logout
            </button>  
        </nav>

    </header>


    <main class="dashboard-container">

        
                    <!-- UPCOMING VIEWING -->

                    <section class="upcoming-viewing-section">

                        <h2>
                            Upcoming Viewing
                        </h2>

                        <div id="upcomingBooking">

                            <div class="empty-state">

                                <h3>
                                    No upcoming viewing
                                </h3>

                                <p>
                                    You currently have no
                                    upcoming viewing appointments.
                                </p>

                            </div>

                        </div>

                    </section>


        <!-- PAGE HEADING -->

        <section class="dashboard-heading">

            <div>
                <h2>Available Properties</h2>

                <p>
                    Browse rental properties and schedule
                    a viewing appointment.
                </p>
            </div>

        </section>


       <!-- FILTER -->

<section class="renter-filter">

    <div>
        <label for="propertyStateFilter">
            State
        </label>

        <select id="propertyStateFilter">
            <option value="ALL">
                All States
            </option>

            <option value="Johor">Johor</option>
            <option value="Kedah">Kedah</option>
            <option value="Kelantan">Kelantan</option>
            <option value="Melaka">Melaka</option>
            <option value="Negeri Sembilan">Negeri Sembilan</option>
            <option value="Pahang">Pahang</option>
            <option value="Penang">Penang</option>
            <option value="Perak">Perak</option>
            <option value="Perlis">Perlis</option>
            <option value="Sabah">Sabah</option>
            <option value="Sarawak">Sarawak</option>
            <option value="Selangor">Selangor</option>
            <option value="Terengganu">Terengganu</option>
            <option value="Kuala Lumpur">Kuala Lumpur</option>
            <option value="Putrajaya">Putrajaya</option>
            <option value="Labuan">Labuan</option>
        </select>
    </div>


    <div>
        <label for="propertyCityFilter">
            City
        </label>

        <select
            id="propertyCityFilter"
            disabled
        >
            <option value="ALL">
                All Cities
            </option>
        </select>
    </div>


    <div>
        <label for="propertyTypeFilter">
            Property Type
        </label>

        <select id="propertyTypeFilter">

            <option value="ALL">
                All Property Types
            </option>

            <option value="ROOM">
                Room
            </option>

            <option value="APARTMENT">
                Apartment
            </option>

            <option value="CONDO">
                Condo
            </option>

            <option value="HOUSE">
                House
            </option>

        </select>
    </div>

</section>


        <!-- PROPERTY LIST -->

        <section
            class="property-list"
            id="renterPropertyList"
        >
        </section>

    </main>

    <script src="js/welcome.js"></script>
    <script src="js/property.js"></script>
    <script src="js/renter.js"></script>
    <script src="js/renter-bookings.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
