<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | Rental Scheduling System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="main-header">
        <h1>Rental Scheduling System</h1>

        <nav>
            <a href="owner-dashboard.html">Dashboard</a>
            <button type="button">Logout</button>
        </nav>
    </header>

    <main class="dashboard-container">

        <section class="form-section">

            <div class="page-heading">
                <h2>Add Property</h2>
                <p>Add a new rental property to your listing.</p>
            </div>

            <form id="propertyForm">

                <label for="propertyName">Property Name</label>
                <input
                    type="text"
                    id="propertyName"
                    placeholder="Example: Vista Residence"
                    required
                >

                <label for="propertyType">Property Type</label>
                <select id="propertyType" required>
                    <option value="">Select property type</option>
                    <option value="ROOM">Room</option>
                    <option value="APARTMENT">Apartment</option>
                    <option value="CONDO">Condo</option>
                    <option value="HOUSE">House</option>
                </select>

                <label for="propertyUnit">Unit / Block / Room</label>
                <input
                    type="text"
                    id="propertyUnit"
                    placeholder="Example: Block A, Unit 12-03"
                    required
                >

                <label for="propertyMap">Google Maps URL</label>
                <input
                    type="url"
                    id="propertyMap"
                    placeholder="Paste Google Maps link"
                    required
                >

                <label for="propertyImage">Property Image</label>
                <input
                    type="file"
                    id="propertyImage"
                    accept="image/*"
                    required
                >

                <label for="propertyDescription">Description</label>
                <textarea
                    id="propertyDescription"
                    rows="5"
                    placeholder="Enter property description"
                    required
                ></textarea>

                <label for="propertyRent">Monthly Rent (RM)</label>
                <input
                    type="number"
                    id="propertyRent"
                    min="0"
                    step="0.01"
                    placeholder="Example: 1200"
                    required
                >

                <div class="form-actions">
                    <a href="owner-dashboard.html">Cancel</a>
                    <button type="submit">Add Property</button>
                </div>

            </form>

        </section>

    </main>
<script src="js/property.js"></script>
</body>
</html>
