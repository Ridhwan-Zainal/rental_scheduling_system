<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Property | Rental Scheduling System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <header class="main-header">

        <h1>Rental Scheduling System</h1>

        <nav>
            <span class="header-user">
            Welcome,
            <strong id="headerUserName"></strong>
             </span>
            <a href="owner-dashboard.html">Dashboard</a>

            <button
                type="button"
                id="logoutButton"
            >
                Logout
            </button>
        </nav>

    </header>


    <main class="dashboard-container">

        <section class="form-section">

            <div class="page-heading">

                <h2>Add Property</h2>

                <p>
                    Add a new rental property to your listing.
                </p>

            </div>


            <form id="propertyForm">


                <!-- PROPERTY NAME -->

                <label for="propertyName">
                    Property Name
                </label>

                <input
                    type="text"
                    id="propertyName"
                    placeholder="Example: Vista Residence"
                    required
                >


                <!-- PROPERTY TYPE -->

                <label for="propertyType">
                    Property Type
                </label>

                <select
                    id="propertyType"
                    required
                >
                    <option value="">
                        Select property type
                    </option>

                    <option value="ROOM">
                        Room
                    </option>

                    <option value="APARTMENT">
                        Apartment
                    </option>

                    <option value="CONDO">
                        Condo
                    </option>

                    <option value="HOUSE">
                        House
                    </option>
                </select>


                <!-- STATE -->

                <label for="propertyState">
                    State
                </label>

                <select
                    id="propertyState"
                    required
                >
                    <option value="">Select state </option>
                    <option value="Johor">Johor</option>
                    <option value="Kedah">Kedah</option>
                    <option value="Kelantan">Kelantan</option>
                    <option value="Melaka">Melaka</option>
                    <option value="Negeri Sembilan">Negeri Sembilan</option>
                    <option value="Pahang">Pahang</option>
                    <option value="Penang">Penang</option>
                    <option value="Perak">Perak</option>
                    <option value="Perlis">Perlis</option>
                    <option value="Sabah">Sabah</option>
                    <option value="Sarawak">Sarawak</option>
                    <option value="Selangor">Selangor</option>
                    <option value="Terengganu">Terengganu</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
                    <option value="Putrajaya">Putrajaya</option>
                    <option value="Labuan">Labuan</option>
                </select>


                <!-- CITY -->

                <label for="propertyCity">
                    City
                </label>

                <select
                    id="propertyCity"
                    required
                    disabled
                >
                    <option value="">
                        Select city
                    </option>
                </select>


                <!-- UNIT -->

                <label for="propertyUnit">
                    Unit / Block / Room
                </label>

                <input
                    type="text"
                    id="propertyUnit"
                    placeholder="Example: Block A, Unit 12-03"
                    required
                >


                <!-- GOOGLE MAPS -->

                <label for="propertyMap">
                    Google Maps URL
                </label>

                <input
                    type="url"
                    id="propertyMap"
                    placeholder="Paste Google Maps link"
                    required
                >


                <!-- PROPERTY IMAGE -->

                <label for="propertyImage">
                    Property Image
                </label>

                <input
                    type="file"
                    id="propertyImage"
                    accept="image/*"
                >


                <!-- DESCRIPTION -->

                <label for="propertyDescription">
                    Description
                </label>

                <textarea
                    id="propertyDescription"
                    rows="5"
                    placeholder="Enter property description"
                ></textarea>


                <!-- RENT -->

                <label for="propertyRent">
                    Monthly Rent (RM)
                </label>

                <input
                    type="number"
                    id="propertyRent"
                    min="0"
                    step="0.01"
                    placeholder="Example: 1200"
                    required
                >


                <!-- MESSAGE -->

                <p id="propertyMessage"></p>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <a href="owner-dashboard.html">
                        Cancel
                    </a>

                    <button type="submit">
                        Add Property
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="js/welcome.js"></script>
    <script src="js/property.js"></script>
    <script src="js/logout.js"></script>

</body>
</html>
